<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Posso Faltar?</title>
<meta name="description" content="Controle de presença da turma de Administração: quantas faltas você ainda pode ter.">
<meta name="theme-color" content="#1E2A52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Posso Faltar?">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F8; --card:#FFFFFF; --ink:#141A2B; --muted:#5B6480; --line:rgba(20,26,43,.11);
  --accent:#3D4BC8; --on-accent:#FFFFFF; --head:#1E2A52; --on-head:#FFFFFF;
  --ok:#17803F; --ok-bg:#E1F4E8; --warn:#8A5F00; --warn-bg:#FFEFC2; --bad:#C23232; --bad-bg:#FCE3E3;
  --soft:#EBEEF6; --shadow:0 1px 2px rgba(20,26,43,.06),0 6px 18px rgba(20,26,43,.06);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ios-bar:0px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1220; --card:#171C30; --ink:#EEF1FA; --muted:#9AA3BF; --line:rgba(238,241,250,.13);
    --accent:#7C89F5; --on-accent:#0E1220; --head:#171C30; --on-head:#EEF1FA;
    --ok:#4ADE80; --ok-bg:#123524; --warn:#FBC948; --warn-bg:#3A2E0B; --bad:#FF8A8A; --bad-bg:#3E1717;
    --soft:#212745; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1220; --card:#171C30; --ink:#EEF1FA; --muted:#9AA3BF; --line:rgba(238,241,250,.13);
  --accent:#7C89F5; --on-accent:#0E1220; --head:#171C30; --on-head:#EEF1FA;
  --ok:#4ADE80; --ok-bg:#123524; --warn:#FBC948; --warn-bg:#3A2E0B; --bad:#FF8A8A; --bad-bg:#3E1717;
  --soft:#212745; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
@media (display-mode:browser){ @supports (-webkit-touch-callout:none){ :root{--ios-bar:72px} } }

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;min-height:100%;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
.app{max-width:560px;margin:0 auto;min-height:100dvh;position:relative}

/* topo */
.top{background:var(--head);color:var(--on-head);padding:16px 18px 14px;position:sticky;top:0;z-index:20}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand small{display:block;font-weight:600;font-size:11.5px;opacity:.7;letter-spacing:.02em;margin-top:1px}
.datechip{font-weight:700;font-size:12.5px;background:rgba(255,255,255,.14);padding:7px 12px;border-radius:999px;white-space:nowrap}

main{padding:16px 16px calc(96px + var(--ios-bar))}
.view{display:none}.view.on{display:block;animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px}
h2:first-child{margin-top:4px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.stack{display:grid;gap:12px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;font-weight:700;background:var(--accent);color:var(--on-accent);transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.block{width:100%}

/* veredito */
.verdict{border-radius:24px;padding:20px 20px 18px;transition:background .3s,color .3s;position:relative;overflow:hidden}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.warn{background:var(--warn-bg);color:var(--warn)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.verdict.none{background:var(--soft);color:var(--ink)}
.verdict .k{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;opacity:.85}
.verdict .big{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:6px 0 10px}
.verdict .why{font-size:14.5px;font-weight:600;color:var(--ink);display:grid;gap:6px}
.verdict .why div{display:flex;align-items:center;gap:8px}
.verdict .note{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:10px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}

/* aulas do dia */
.cls{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.cls:first-of-type{border-top:0}
.cls b{font-weight:700}
.cls .meta{font-size:12.5px;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.seg button{min-height:50px;border-radius:14px;font-weight:800;background:var(--soft);color:var(--muted);transition:background .2s,color .2s,transform .12s}
.seg button:active{transform:scale(.97)}
.seg button.on.go{background:var(--ok-bg);color:var(--ok)}
.seg button.on.out{background:var(--bad-bg);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 12px;border-radius:12px;background:var(--soft);font-weight:700;font-size:13.5px;border:2px solid transparent}
.chip.on{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.chip.on.plan{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}

/* matérias */
.sub{display:grid;gap:10px}
.sub-h{display:flex;align-items:flex-start;gap:12px}
.sub-h .nm{font-weight:800;font-size:16.5px;letter-spacing:-.01em}
.sub-h .pf{font-size:12.5px;color:var(--muted)}
.sub-h .tag{margin-left:auto;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
.bar{height:12px;border-radius:999px;background:var(--soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar .u{background:var(--ink);opacity:.82}
.bar .p{background:repeating-linear-gradient(135deg,var(--warn) 0 4px,transparent 4px 8px);opacity:.9}
.nums{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.nums span:last-child{color:var(--muted);font-weight:600}
.big-n{font-size:15px}
.big-n b{font-size:22px;font-weight:800;letter-spacing:-.02em}

/* calendário */
.cal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cal .hd{font-size:11px;font-weight:800;color:var(--muted);text-align:center;letter-spacing:.04em;text-transform:uppercase;padding-bottom:2px}
.wk{grid-column:1/-1;font-size:11.5px;font-weight:700;color:var(--muted);margin:8px 2px -2px}
.cell{aspect-ratio:1/1.08;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;font-weight:800;font-size:15px;border:2px solid transparent;transition:transform .12s}
.cell:active{transform:scale(.94)}
.cell .dots{display:flex;gap:3px;min-height:8px}
.cell .dots i{width:8px;height:8px;border-radius:50%;display:block}
.cell.abs{background:var(--bad-bg);color:var(--bad)}
.cell.plan{background:var(--warn-bg);color:var(--warn);border:2px dashed var(--warn)}
.cell.hol{background:var(--soft);color:var(--muted);box-shadow:none}
.cell.ava{background:transparent;box-shadow:none;border:2px dashed var(--line);color:var(--muted)}
.cell.today{border-color:var(--accent)}
.cell .lb{position:absolute;bottom:3px;font-size:8.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;opacity:.85}
.cell.blank{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;font-weight:600;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:5px;display:block}

/* planner */
.dayrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.dayrow:first-child{border-top:0}
.dayrow .d{width:54px;flex:none;font-weight:800;line-height:1.15}
.dayrow .d small{display:block;font-size:11.5px;font-weight:600;color:var(--muted)}
.dayrow .s{flex:1;display:flex;gap:5px;flex-wrap:wrap}
.mini{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);display:inline-flex;align-items:center;gap:5px}
.sw{width:50px;height:30px;border-radius:999px;background:var(--soft);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--warn)}.sw.on::after{transform:translateX(20px)}
.sw.accent.on{background:var(--accent)}
.flag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.flag.ok{background:var(--ok-bg);color:var(--ok)}.flag.warn{background:var(--warn-bg);color:var(--warn)}.flag.bad{background:var(--bad-bg);color:var(--bad)}
.field{display:grid;gap:6px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.inp{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 12px;width:100%;font-weight:700}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.alert{border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px}
.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.ok{background:var(--ok-bg);color:var(--ok)}

/* ajustes */
.setrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow .t{flex:1;font-weight:700}.setrow .t small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.num{width:76px;min-height:42px;text-align:center}
ol.how{padding-left:20px;display:grid;gap:6px;color:var(--muted);font-size:14px}

/* abas */
.tabs{position:fixed;left:0;right:0;bottom:var(--ios-bar);z-index:30;display:flex;justify-content:center;pointer-events:none}
.tabs nav{pointer-events:auto;width:100%;max-width:560px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px 8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;font-size:11px;font-weight:700;color:var(--muted);transition:color .2s}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab.on svg{transform:translateY(-1px)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,28,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .in{width:100%;max-width:560px;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(24px + var(--ios-bar));max-height:86dvh;overflow:auto}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--ios-bar));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (hover:hover){.btn:hover{opacity:.9}.cell:hover{transform:translateY(-1px)}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">Posso Faltar?<small>Administração · Faculdade IBG · 2026/2</small></div>
      <div class="datechip" id="chip"></div>
    </div>
  </header>

  <main>
    <section class="view on" id="v-hoje"></section>
    <section class="view" id="v-materias"></section>
    <section class="view" id="v-calendario"></section>
    <section class="view" id="v-ferias"></section>
    <section class="view" id="v-ajustes"></section>
  </main>

  <div class="tabs"><nav id="tabs">
    <button class="tab on" data-v="hoje"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16.5 9.5"/></svg>Hoje</button>
    <button class="tab" data-v="materias"><svg viewBox="0 0 24 24"><path d="M5 4.5h10a3 3 0 013 3V20H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h10"/></svg>Matérias</button>
    <button class="tab" data-v="calendario"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="3"/><path d="M8 3.5v4M16 3.5v4M4 10.5h16"/></svg>Calendário</button>
    <button class="tab" data-v="ferias"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0118 0z"/><path d="M12 12v7.5a2 2 0 004 0"/><path d="M12 3v1.5"/></svg>Férias</button>
    <button class="tab" data-v="ajustes"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Ajustes</button>
  </nav></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ============ DADOS DO CALENDÁRIO (2º bimestre, conforme cronograma do IBG) ============ */
var SUBJ = {
  EST:{name:'Estatística',       prof:'Danilo',        color:'#3B82F6'},
  DIR:{name:'Noções do Direito', prof:'Ângela',        color:'#8B5CF6'},
  SOC:{name:'Sociologia',        prof:'Wilson Ortega', color:'#F97316'},
  MKT:{name:'Marketing',         prof:'Cristiana',     color:'#EC4899'},
  ADM:{name:'Teorias ADM',       prof:'Juliano',       color:'#14B8A6'}
};
var CODES = ['EST','DIR','SOC','MKT','ADM'];
var TPL = {1:['EST','DIR'],2:['EST','SOC'],3:['SOC','MKT'],4:['ADM','MKT'],5:['DIR','ADM']};
// Cada semana: m = segunda-feira; d = exceções por dia da semana (1..5); sat = sábado
var WEEKS = [
  {m:'2026-10-26', sat:{kind:'ava', items:[['DIR',2]]}},
  {m:'2026-11-02', d:{1:'F'}, sat:{kind:'sab', items:[['EST',2],['DIR',2]]}},
  {m:'2026-11-09', sat:{kind:'sab', items:[['EST',2],['DIR',2]]}},
  {m:'2026-11-16', d:{5:'F'}, sat:{kind:'sab', items:[['DIR',2],['ADM',2]]}},
  {m:'2026-11-23', sat:{kind:'ava', items:[['ADM',2]]}},
  {m:'2026-11-30', prova:true, d:{1:[['EST',4]],2:[['DIR',4]],3:[['SOC',4]],4:[['MKT',4]],5:[['ADM',4]]}, sat:{kind:'none'}},
  {m:'2026-12-07', d:{4:'F'}, sat:{kind:'sab', items:[['ADM',2],['MKT',2]]}},
  {m:'2026-12-14', d:{1:'PF',2:'PF',3:'V',4:'V',5:'V'}, sat:{kind:'V'}}
];
function pad(n){return (n<10?'0':'')+n}
function iso(dt){return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2],12,0,0)}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
var CAL = [];
WEEKS.forEach(function(w){
  for(var i=0;i<6;i++){
    var date = addDays(w.m,i), dow=i+1, day={date:date,dow:dow,kind:'aula',items:[],prova:!!w.prova,wk:w.m};
    if(dow<=5){
      var ex = w.d && w.d[dow];
      if(ex==='F'){day.kind='feriado'}
      else if(ex==='PF'){day.kind='pf'}
      else if(ex==='V'){day.kind='ferias'}
      else if(ex){day.items=ex}
      else {day.items=TPL[dow].map(function(c){return [c,2]})}
    } else {
      var s = w.sat||{kind:'none'};
      day.kind = s.kind==='V'?'ferias':(s.kind==='none'?'sem':s.kind);
      day.items = s.items||[];
    }
    CAL.push(day);
  }
});
var BYDATE = {}; CAL.forEach(function(d){BYDATE[d.date]=d});
var FIRST = CAL[0].date, LAST_CLASS = '2026-12-12';

/* ============ ESTADO ============ */
var KEY='posso-faltar-v1';
function defaults(){return {v:1,limit:16,base:{EST:0,DIR:0,SOC:0,MKT:0,ADM:0},abs:{},plan:{},satAva:false,reminder:'22:00',onboarded:false}}
var S = load();
function load(){
  try{var r=JSON.parse(localStorage.getItem(KEY)); if(r&&r.v===1){var d=defaults(); for(var k in d){if(!(k in r))r[k]=d[k]} return r}}catch(e){}
  return defaults();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

var QS = new URLSearchParams(location.search);
function realToday(){return iso(new Date())}
function today(){var t=QS.get('hoje'); if(t&&/^\d{4}-\d{2}-\d{2}$/.test(t))return t; return realToday()}

/* ============ CÁLCULOS ============ */
function counted(day){
  if(!day||!day.items||!day.items.length)return [];
  if(day.kind==='ava'&&!S.satAva)return [];
  return day.items;
}
function nOf(day,code){var it=counted(day),n=0;it.forEach(function(x){if(x[0]===code)n+=x[1]});return n}
function usedOf(code,skipDate){
  var u=+S.base[code]||0;
  for(var dt in S.abs){if(dt===skipDate)continue;var day=BYDATE[dt]; if(!day)continue; if(S.abs[dt].indexOf(code)>-1)u+=nOf(day,code)}
  return u;
}
function plannedOf(code,skipDate){
  var p=0;
  for(var dt in S.plan){
    if(dt===skipDate)continue; var day=BYDATE[dt]; if(!day)continue;
    var a=S.abs[dt]||[];
    if(S.plan[dt].indexOf(code)>-1 && a.indexOf(code)<0)p+=nOf(day,code);
  }
  return p;
}
function remaining(code){return S.limit-usedOf(code)}
function reserve(code,skipDate){return S.limit-usedOf(code,skipDate)-plannedOf(code,skipDate)}
function futureDays(from){return CAL.filter(function(d){return d.date>=from&&counted(d).length})}
function aulasLeft(code,from){var n=0;CAL.forEach(function(d){if(d.date>=from)n+=nOf(d,code)});return n}
function diasLeft(r,per){return Math.max(0,Math.floor(r/(per||2)))}
function status(r){return r<=1?'bad':(r<=5?'warn':'ok')}   // r = faltas restantes

function verdict(day){
  var it=counted(day); if(!it.length)return null;
  var lines=[],worst='ok';
  it.forEach(function(x){
    var r=reserve(x[0],day.date), after=r-x[1], st=after<0?'bad':(after<=3?'warn':'ok');
    var isAbs=(S.abs[day.date]||[]).indexOf(x[0])>-1;
    lines.push({code:x[0],n:x[1],r:r,after:after,st:st,abs:isAbs});
  });
  var anyAbs=lines.some(function(l){return l.abs});
  lines.forEach(function(l){ if(anyAbs&&!l.abs)return; if(l.st==='bad')worst='bad'; else if(l.st==='warn'&&worst!=='bad')worst='warn'; });
  return {st:worst,lines:lines,done:anyAbs};
}

/* lembretes .ics */
function icsFile(){
  var tm=(S.reminder||'22:00').replace(':',''), L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Posso Faltar//PT','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Posso Faltar? (lembretes)'];
  CAL.forEach(function(d,i){

    var ymd=d.date.replace(/-/g,''), mins=Math.min(23*60+59,(+tm.slice(0,2))*60+(+tm.slice(2))+15), end=pad(Math.floor(mins/60))+pad(mins%60)+'00';
    L.push('BEGIN:VEVENT','UID:pf-'+ymd+'@posso-faltar','DTSTAMP:20261022T120000Z','DTSTART:'+ymd+'T'+tm+'00','DTEND:'+ymd+'T'+end,
      'SUMMARY:Você foi à aula hoje? Marque no Posso Faltar?',

/* ============ EVENTOS ============ */
document.addEventListener('click',function(e){
  var tabEl=e.target.closest('.tab'); if(tabEl){go(tabEl.dataset.v);return}
  if(e.target.id==='scrim'){closeSheet();return}
  var el=e.target.closest('[data-act]'); if(!el)return;
  var act=el.dataset.act, d=el.dataset.d, c=el.dataset.c, day=d&&BYDATE[d];
  switch(act){
    case 'openday': openDay(d); break;
    case 'present': setAbs(d,[]); render(); break;
    case 'absent': setAbs(d,codesOf(day)); var pl=(S.plan[d]||[]); if(pl.length)setPlan(d,[]); render(); toast('Falta marcada em '+dm(d)); break;
    case 'tg': setAbs(d,toggleIn(S.abs[d]||[],c)); render(); break;
    case 'tp': setPlan(d,toggleIn(S.plan[d]||[],c)); render(); break;
    case 'plandayall':
      if((S.plan[d]||[]).length)setPlan(d,[]); else setPlan(d,codesOf(day));
      render(); break;
    case 'planrange':
      var a=$('#pf1').value,b=$('#pf2').value;
      if(!a||!b){toast('Escolha as duas datas');break}
      if(b<a){var tmp=a;a=b;b=tmp}
      var n=0;CAL.forEach(function(x){if(x.date>=a&&x.date<=b&&counted(x).length&&x.date>(today()>FIRST?addDays(today(),-1):'0000')){setPlan(x.date,codesOf(x));n++}});
      render();toast(n?plural(n,'dia planejado','dias planejados'):'Nenhum dia de aula nesse período');break;
    case 'planclear': S.plan={};save();render();toast('Plano limpo');break;
    case 'goset': go('ajustes'); break;
    case 'skipboard': S.onboarded=true;save();render();break;
    case 'satava': S.satAva=!S.satAva;save();render();break;
    case 'ics':
      var r=$('#rem');if(r&&r.value){S.reminder=r.value;save()}
      download('lembretes-posso-faltar.ics','text/calendar',icsFile());toast('Abra o arquivo para adicionar ao calendário');break;
    case 'share':
      var data={title:'Posso Faltar?',text:'Calcule quantas faltas você ainda pode ter:',url:location.href.split('?')[0]};
      if(navigator.share){navigator.share(data).catch(function(){})}
      else if(navigator.clipboard){navigator.clipboard.writeText(data.url);toast('Link copiado')}
      break;
    case 'export': download('posso-faltar-backup.json','application/json',JSON.stringify(S));break;
    case 'reset':
      if(el.dataset.sure){S=defaults();save();render();toast('Dados apagados')}
      else{el.dataset.sure='1';el.textContent='Toque de novo para confirmar';setTimeout(function(){el.dataset.sure='';el.textContent='Apagar tudo'},3500)}
      break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.base){S.base[t.dataset.base]=Math.max(0,+t.value||0);S.onboarded=true;save();render();return}
  if(t.id==='lim'){S.limit=Math.max(1,+t.value||16);save();render();return}
  if(t.id==='rem'){S.reminder=t.value||'22:00';save();return}
  if(t.id==='sim'){var u=new URL(location.href);if(t.value)u.searchParams.set('hoje',t.value);else u.searchParams.delete('hoje');QS=u.searchParams;history.replaceState(null,'',u);render();return}
  if(t.id==='imp'&&t.files&&t.files[0]){
    var fr=new FileReader();fr.onload=function(){try{var r=JSON.parse(fr.result);if(r&&r.v===1){S=r;save();render();toast('Backup restaurado')}else toast('Arquivo inválido')}catch(x){toast('Arquivo inválido')}};fr.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

render();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
})();
</script>
</body>
</html>
